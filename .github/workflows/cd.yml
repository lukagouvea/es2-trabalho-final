name: CD

on:
  push:
    branches: [master]

permissions:
  contents: read

# Nunca interromper uma migração que já começou.
concurrency:
  group: production-master
  cancel-in-progress: false

jobs:
  validate:
    name: Validar commit de produção
    uses: ./.github/workflows/ci.yml

  migrate:
    name: Migrar produção
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Recusar commit obsoleto
        shell: bash
        run: |
          set -euo pipefail
          current_sha=$(git ls-remote origin refs/heads/master | cut -f1)
          test "$current_sha" = "$GITHUB_SHA"
      - name: Aplicar migrações pendentes
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          : "${SUPABASE_ACCESS_TOKEN:?Configure o secret de produção}"
          : "${SUPABASE_DB_PASSWORD:?Configure o secret de produção}"
          : "${SUPABASE_PROJECT_ID:?Configure a variável de produção}"
          npx supabase link --project-ref "$SUPABASE_PROJECT_ID"
          npx supabase db push --remote --skip-vault --dry-run
          npx supabase db push --remote --skip-vault --yes

  ready:
    name: Produção pronta
    needs: [validate, migrate]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Exigir validação e migração bem-sucedidas
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
      - uses: actions/checkout@v6
      - name: Confirmar commit atual antes da liberação
        shell: bash
        run: |
          set -euo pipefail
          current_sha=$(git ls-remote origin refs/heads/master | cut -f1)
          test "$current_sha" = "$GITHUB_SHA"
