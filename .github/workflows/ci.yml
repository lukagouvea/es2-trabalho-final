name: CI

on:
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Qualidade e build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: quality-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npx prettier --check '.github/workflows/*.yml'
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:55321
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-key

  database:
    name: Banco e integração
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: database-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:db
      - run: npm run db:start
      - name: Configurar integração local
        shell: bash
        run: |
          set -euo pipefail
          npx supabase status --output json > "$RUNNER_TEMP/supabase-status.json"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const status = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/supabase-status.json`, 'utf8'));
          const values = {
            SUPABASE_URL: status.API_URL,
            SUPABASE_PUBLISHABLE_KEY: status.ANON_KEY,
            CAMPUS_TEST_DATABASE_URL: status.DB_URL,
          };
          for (const [name, value] of Object.entries(values)) {
            if (!value || /[\r\n]/.test(value)) throw new Error(`Configuração local inválida: ${name}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `${name}=${value}\n`);
          }
          JS
          rm "$RUNNER_TEMP/supabase-status.json"
      - run: npm run test:integration
      - name: Encerrar Supabase local
        if: ${{ always() }}
        run: npx --no-install supabase stop --no-backup

  browser:
    name: Navegador
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: browser-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Selecionar Chromium instalado
        run: node -e 'console.log("CAMPUS_CHROME=" + require("@playwright/test").chromium.executablePath())' >> "$GITHUB_ENV"
      - run: npm run test:e2e -- --workers=1 --forbid-only --reporter=line,html --trace=retain-on-failure
      - name: Executar testes do protótipo
        if: ${{ !cancelled() }}
        run: npm run test:prototype
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  approved:
    name: CI aprovado
    needs: [quality, database, browser]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Exigir sucesso de todas as suítes
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
